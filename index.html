const BL = '______';
function opts4(rng, ans, cands){
  const out = [ans];
  for (const c of cands) { if (out.length === 4) break; if (c && !out.includes(c)) out.push(c); }
  return shuffle(rng, out);
}

 {lv:3, t:'文章：在地企業轉型', kind:'Article', text:[
   'FAIRVIEW — When Moretti Printing opened in 1987, most of its business came from local newspapers. Today, the family-owned company earns more than half of its income from an unexpected source: custom packaging.',

   'The change was not easy. Moretti Printing had to retrain its staff, and it took almost three years before the packaging business became profitable. Now, however, the company employs 45 people — nearly twice as many as in 2014.',
   'Next spring, Moretti plans to open a design studio to help clients create their packaging from start to finish.'],

 {lv:4, t:'文章：遠距工作政策調查', kind:'Article', text:[

   'Employees, however, appear less convinced. Nearly half of the workers surveyed said they would consider leaving their current job if in-office requirements were increased further. The figure was highest among employees with commutes of more than 45 minutes.',
   'The report recommends that employers clearly explain the purpose of in-office days and schedule them around activities that genuinely benefit from face-to-face interaction, such as planning sessions and training. "Mandating attendance without a clear rationale tends to undermine morale," noted lead researcher Dr. Ingrid Solberg.',
   'The institute plans to release a follow-up study next year examining the impact of these policies on staff retention.'],

// ================= 記憶系統：間隔複習（遺忘曲線）＋進度配速（學習曲線）＋單字量檢測 =================
// 設計重點
// 1. 每個學過的字都進入複習排程（不是只有答錯的字）：1→2→4→7→15→30→60→120→180 天。
//    依艾賓浩斯遺忘曲線，記憶在剛學完時下降最快，所以前幾次間隔短、之後逐步拉長；答錯就回到第 1 天重來。
// 2. 由易到難的提取練習：新字先「認得」（英翻中、聽力），熟了改「說得出」（中翻英），最熟再「拼得出」（拼字）。
// 3. 新字當天練兩次（間隔幾題），比只看一次更容易進入隔天複習。
// 4. 依字頻先學最常用的字（NGSL → TSL → 主題高分字），每天新字量依「剩餘字數 ÷ 剩餘天數」自動配速，
//    但到期複習太多時自動減少新字，避免複習量越滾越大而放棄。
// 5. 開始前先做單字量檢測：已熟的字段標記為「應該會」，排到 1～3 個月後抽查，不用從頭學。
// srs[字] = [連續答對次數 s, 下次到期日, 忘記次數, 上次複習日, 1＝檢測推定已會]

const IV = [1, 2, 4, 7, 15, 30, 60, 120, 180];
const TARGET_DAY = 168;          // 第 24 週結束前學完全部單字，最後兩週全真模擬
const dnum = () => Math.round(today() / DAY);
const MASTER = 7;                // 下次間隔 ≥ 60 天視為熟練
const isMastered = e => !!e && (e[0] >= MASTER || e[4] === 1);

function histDay(){ const d = dnum(); return S.hist[d] = S.hist[d] || {n:0, ok:0, bad:0, L:0, M:0}; }
function histSnap(){ const h = histDay(); let L = 0, M = 0; for (const w in S.srs) { L++; if (isMastered(S.srs[w])) M++; } h.L = L; h.M = M; }
function srsLearn(w, ok){
  const t = dnum(), e = S.srs[w];
  if (e && e[3] === t && e[4] === 0) { if (!ok) { e[0] = 0; e[1] = t + 1; } return; }   // 當天第二次練習
  if (!e || e[4] === 1) { S.daily.newDone = (S.daily.newDone || 0) + 1; histDay().n++; }
  S.srs[w] = [ok ? 1 : 0, t + 1, e ? e[2] : 0, t, 0];
}
function srsReview(w, ok){
  const e = S.srs[w], t = dnum(); if (!e) return;
  if (e[1] > t) { if (!ok) { S.srs[w] = [0, t + 1, e[2] + 1, t, 0]; histDay().bad++; } return; }  // 還沒到期：答對不加分，答錯算忘記
  if (ok) { const s = e[0] + 1; S.srs[w] = [s, t + IV[Math.min(s - 1, IV.length - 1)], e[2], t, 0]; histDay().ok++; }
  else { S.srs[w] = [0, t + 1, e[2] + 1, t, 0]; histDay().bad++; }
}
function vocabAnswered(entry, ok){
  const w = entry.it.split('|')[1];
  if (entry.mode === 'learn') srsLearn(w, ok); else srsReview(w, ok);
  histSnap();
}
const dueWords = () => { const t = dnum(); return Object.keys(S.srs).filter(w => S.srs[w][1] <= t && VMAP[w]).sort((a, b) => S.srs[a][1] - S.srs[b][1] || S.srs[a][0] - S.srs[b][0]); };
function revType(w, rng){
  const e = S.srs[w], s = e ? e[0] : 0, W = VMAP[w];
  if (s <= 2 && !(e && e[4])) return pick(rng, ['e2c', 'e2c', 'listen']);
  if (s <= 5) return pick(rng, ['c2e', 'c2e', 'listen', 'e2c']);
  return canSpell(W) && rng() < 0.6 ? 'spell' : 'c2e';
}
function retention(e){
  if (!e) return 0;
  const t = dnum() - e[3];
  if (e[0] === 0 && !e[4]) return 0.5 * Math.pow(0.9, t);
  return Math.pow(0.9, t / Math.max(1, e[1] - e[3]));   // 到期當天約 90%
}
function memStats(){
  const t = dnum(); let L = 0, M = 0, A = 0, R = 0, due = 0, leech = [];
  const fc = Array(7).fill(0);
  for (const w in S.srs) { const e = S.srs[w]; if (!VMAP[w]) continue; L++; if (isMastered(e)) M++; if (e[4]) A++; R += retention(e); if (e[1] <= t) due++; if (e[2] >= 4) leech.push(w); const k = e[1] - t; if (k >= 0 && k < 7) fc[k]++; else if (k < 0) fc[0]++; }
  return {L, M, A, R:Math.round(R), due, leech, fc, total:VOCAB.length};
}

// ---------- 配速：每天新字量 ----------
const learnOrder = () => VOCAB.filter(w => !S.srs[w.w]).sort((a, b) => a.lv - b.lv || a.p - b.p);
function paceBase(){ const rem = VOCAB.filter(w => !S.srs[w.w]).length, left = Math.max(7, TARGET_DAY - dayOfPlan()); return {rem, left, base:rem ? Math.min(40, Math.max(10, Math.ceil(rem / left))) : 0}; }
function newQuota(){
  const p = paceBase(), due = dueWords().length; let q = p.base, why = `剩 ${p.rem} 字 ÷ 剩 ${p.left} 天，每天約 ${p.base} 個新字`;
  if (due > 150) { q = 0; why = `到期複習有 ${due} 個（超過 150），今天先專心複習，不學新字`; }
  else if (due > 100) { q = Math.min(q, 10); why = `到期複習有 ${due} 個，新字先減為 10 個`; }
  else if (due > 60) { q = Math.ceil(q * 0.6); why = `到期複習有 ${due} 個，新字減為 6 成`; }
  return {q, why, ...p};
}

function lessonNew(n){
  const words = learnOrder().slice(0, n);

  flashList(words, `新字（${LV_SHORT[words[0].lv]}・依字頻）`, () => {
    // 每個新字練兩次：先認得（英翻中／聽力），間隔幾題後再說得出（中翻英／拼字）
    const a = shuffle(rng, words).map(w => ({it:`v|${w.w}|${rng() < 0.7 ? 'e2c' : 'listen'}`, mode:'learn'}));
    const b = shuffle(rng, words).map(w => ({it:`v|${w.w}|${canSpell(w) && rng() < 0.4 ? 'spell' : 'c2e'}`, mode:'learn'}));
    const items = [];
    a.forEach((x, i) => { items.push(x); if (i >= 4 && b.length) items.push(b.shift()); });
    items.push(...b);
    runQuiz({title:'新字練習', items, noSupp:true, next:['回今日課表', lessonPage]});
  });
}
function lessonMix(){
  const wk = curWeek(), P = PLAN[wk - 1], lv = P.lv || pick(mulberry32(dnum()), [2, 3, 4]), rng = mulberry32(dnum() * 31 + wk), items = [];
  const g = weekGram(wk) || gramPool(lv).map(x => x.split('|').slice(0, 3).join('|'));
  for (let i = 0; i < 6; i++) items.push(expandGram(pick(rng, g), rng));   // 本週文法重點
  items.push(...p5Set(lv, 4, rng));                                        // 依多益 Part 5 出題比重
  weakParts().forEach(w => items.push(...partItems(w.k, lv, rng, 3)));       // 依弱項加強
  for (let i = 0; i < 5; i++) items.push(pick(rng, p2Items(lv)));
  items.push(...shuffle(rng, talkIdx(lv).flatMap(talkItems)).slice(0, 3));
  items.push(...shuffle(rng, [...p6Idx(lv).flatMap(p6Items), ...p7Idx(lv).flatMap(p7Items)]).slice(0, 3));
  items.push(...shuffle(rng, orderItems(lv)).slice(0, 2));
  const wr = dueKeys().slice(0, 20).map(k => ({it:keyToItem(k, rng), wrongKey:k}));
  runQuiz({title:`第 ${wk} 週・綜合練習`, items:[...shuffle(rng, items), ...wr], onDone:() => { S.daily.mix = true; save(); }, next:['回今日課表', lessonPage]});
}

function toggleBook(w){ if (S.book[w]) delete S.book[w]; else S.book[w] = 1; save(); document.querySelectorAll(`[data-star="${CSS.escape(w)}"]`).forEach(b => b.textContent = S.book[w] ? '⭐ 已收藏' : '☆ 收藏'); }

// Part 5 題目分類與出題比重（估計值）
const P5_CAT = {vocab:'字彙（語意與搭配）', form:'詞性判斷', verb:'動詞時態與語態', conj:'連接詞與介系詞', pron:'代名詞', rel:'關係詞與名詞子句', other:'其他'};
const P5_W = {vocab:0.34, form:0.26, verb:0.14, conj:0.13, pron:0.05, rel:0.05, other:0.03};
function p5Cat(item){
  const p = item.split('|');
  if (p[0] === 'g') { const id = p[1];
    if (/wf|edng|cmp/.test(id)) return 'form'; if (/pron/.test(id)) return 'pron'; if (/time/.test(id)) return 'conj';
    if (/quant/.test(id)) return 'other'; return 'verb'; }
  const n = BANK[p[1]][+p[2]].n;
  if (/字彙/.test(n)) return 'vocab'; if (/關係|名詞子句/.test(n)) return 'rel'; if (/代名詞/.test(n)) return 'pron';
  if (/連接詞|介系詞|疑問詞/.test(n)) return 'conj'; if (/形容詞與副詞|分詞|比較/.test(n)) return 'form';
  if (/時態|假設|要求語氣|倒裝/.test(n)) return 'verb'; return 'other';
}
function p5ByCat(lv){ const m = {}; gramPool(lv).forEach(it => (m[p5Cat(it)] = m[p5Cat(it)] || []).push(it)); return m; }
function p5Pick(lv, rng){
  const m = p5ByCat(lv), cats = Object.keys(P5_W).filter(c => m[c]), tot = cats.reduce((a, c) => a + P5_W[c], 0);
  let r = rng() * tot;
  for (const c of cats) { r -= P5_W[c]; if (r <= 0) return pick(rng, m[c]); }
  return pick(rng, m[cats[0]]);
}

// ---------- 工具 ----------
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s){ let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function pick(rng, a){ return a[Math.floor(rng() * a.length)]; }
function shuffle(rng, a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const zhParts = z => z.replace(/（[^）]*）/g, '').split(/[；、]/).map(s => s.trim()).filter(Boolean);
const zhClash = (a, b) => a === b || zhParts(a).some(x => zhParts(b).includes(x));
const LV_NAME = {1:'階段1 基礎', 2:'階段2 550', 3:'階段3 650', 4:'階段4 800'};

const DAY = 86400000;

// ---------- 每日任務＋連續天數 ----------
let toastLater = '';

  const t = today();
  if (S.daily.date !== t) { S.daily = {date:t, correct:0, listen:0, newDone:0, quota0:0, mix:false}; S.daily.quota0 = newQuota().q; }
  const st = S.streak;

    const miss = Math.round((t - st.last) / DAY) - 1;
    if (st.freeze >= miss) { st.freeze -= miss; st.last = t - DAY; toastLater = `🧊 用掉 ${miss} 張冰凍卡，連續紀錄保住了！`; }
    else { st.count = 0; st.last = 0; }

// ---------- Part 6 / 7 ----------
const p6Idx = lv => PART6.map((x, i) => i).filter(i => PART6[i].lv === lv);
const p6Items = i => PART6[i].blanks.map((b, bi) => `p6|${i}|${bi}`);
function buildP6(item, rng){
  const p = item.split('|'), i = +p[1], bi = +p[2], X = PART6[i], b = X.blanks[bi];
  const html = X.text.map(par => `<p>${esc(par).replace(/\[(\d)\]/g, (m, n) => +n - 1 === bi ? `<span class="blank on">(${n}) ______</span>` : `<span class="blank">(${n}) ____</span>`)}</p>`).join('');
  return {key:item, kind:'mc', tag:'Part 6 段落填空', lv:X.lv, sec:'R', prompt:`<div class="passage"><b>${esc(X.kind)}</b>${html}</div>`, sub:`第 (${bi + 1}) 格應填入？`, ans:b[0], opts:shuffle(rng, b.slice(0, 4)), abc:true, tip:`💡 ${b[4]}\n全文中文：${X.zh}`};
}
const p7Idx = lv => PART7.map((x, i) => i).filter(i => PART7[i].lv === lv);
const p7Items = i => PART7[i].qs.map((q, qi) => `p7|${i}|${qi}`);
function buildP7(item, rng){
  const p = item.split('|'), i = +p[1], X = PART7[i], q = X.qs[+p[2]];
  return {key:item, kind:'mc', tag:'Part 7 閱讀', lv:X.lv, sec:'R', prompt:`<div class="passage"><b>${esc(X.kind)}</b>${X.text.map(t => `<p>${esc(t)}</p>`).join('')}</div><div class="sent qline">${esc(q[0])}</div>`, sub:X.lv <= 2 ? esc(q[1]) : '', ans:q[2], opts:shuffle(rng, q.slice(2)), abc:true, tip:`題目：${q[1]}\n全文中文：${X.zh}`};
}

// ---------- 統一建題 ----------
function buildItem(item, rng){
  const p = item.split('|');
  if (p[0] === 'v') return buildVocab(VMAP[p[1]], p[2], rng);
  if (p[0] === 'pl') return buildPlace(item, rng);
  if (p[0] === 'g') return buildGram(p[1], rng);
  if (p[0] === 'b') return buildBank(+p[1], +p[2], +p[3], rng);
  if (p[0] === 'o') return buildOrder(item, rng);
  if (p[0] === 'p2') return buildP2(item, rng);
  if (p[0] === 'p1') return buildP1(item, rng);
  if (p[0] === 't') return buildTalk(item, rng);
  if (p[0] === 'p6') return buildP6(item, rng);
  if (p[0] === 'p7') return buildP7(item, rng);
}
function itemLevel(item){
  const p = item.split('|');
  if (p[0] === 'v' || p[0] === 'pl') return (VMAP[p[1]] || {}).lv || 1;
  if (p[0] === 'g') return +p[1][1];
  if (p[0] === 't') return TALKS[+p[1]].lv;
  if (p[0] === 'p6') return PART6[+p[1]].lv;
  if (p[0] === 'p7') return PART7[+p[1]].lv;
  return +p[1];
}
const vOtherTypes = (w, not) => vTypes(w).filter(t => t !== not && t !== 'spell');
function suppItems(item, rng){
  const p = item.split('|');
  if (p[0] === 'v') { const w = VMAP[p[1]], ts = shuffle(rng, vOtherTypes(w, p[2])); return [0,1,2].map(i => 'v|' + w.w + '|' + ts[i % ts.length]); }
  if (p[0] === 'g') return [item, item, item];
  if (p[0] === 'b') { const n = BANK[p[1]][+p[2]].s.length; return [1,2,3].map(i => `b|${p[1]}|${p[2]}|${(+p[3] + i) % n}`); }
  if (p[0] === 'o') { const n = ORDER[p[1]].length; return [1,2,3].map(i => `o|${p[1]}|${(+p[2] + i) % n}`); }
  if (p[0] === 'p2') { const n = PART2[p[1]].length; return [1,2,3].map(i => `p2|${p[1]}|${(+p[2] + i) % n}`); }
  if (p[0] === 'p1') { const n = PART1[p[1]].length; return [1,2,3].map(i => `p1|${p[1]}|${(+p[2] + i) % n}`); }
  if (p[0] === 't') { const ti = +p[1], others = talkIdx(TALKS[ti].lv).filter(x => x !== ti); return [...talkItems(ti).filter(x => x !== item), ...shuffle(rng, others.flatMap(talkItems))].slice(0, 3); }
  if (p[0] === 'p6') { const i = +p[1]; return [...p6Items(i).filter(x => x !== item), ...shuffle(rng, p6Idx(PART6[i].lv).filter(x => x !== i).flatMap(p6Items))].slice(0, 3); }
  if (p[0] === 'p7') { const i = +p[1]; return [...p7Items(i).filter(x => x !== item), ...shuffle(rng, p7Idx(PART7[i].lv).filter(x => x !== i).flatMap(p7Items))].slice(0, 3); }
  return [item, item, item];
}

// ---------- 錯題本（文法・聽力・閱讀：1→3→7→14→30 天；單字改由 memory.js 間隔複習） ----------
function wrongKey(item){ const p = item.split('|'); return p[0] === 'v' ? 'v|' + p[1] : item; }
function markWrong(item){ if (/^(v|pl)\|/.test(item)) return; S.wrong[wrongKey(item)] = {lv:itemLevel(item), due:today() + DAY, stage:0, ok:0}; save(); }
function reviewResult(k, ok){
  const w = S.wrong[k]; if (!w) return;
  if (ok) { w.ok++; w.stage++; if (w.ok >= 5) delete S.wrong[k]; else w.due = today() + [1,3,7,14,30][Math.min(w.stage, 4)] * DAY; }
  else { w.stage = 0; w.ok = 0; w.due = today() + DAY; }
  save();
}
const dueKeys = () => Object.keys(S.wrong).filter(k => S.wrong[k].due <= today());
function keyToItem(k, rng){ const p = k.split('|'); if (p[0] === 'v') { const w = VMAP[p[1]]; return 'v|' + p[1] + '|' + pick(rng, vOtherTypes(w, '')); } return k; }

// ---------- 題庫池 ----------
function gramPool(lv){ return [...GRAMMAR[lv].map(r => 'g|' + r.id), ...BANK[lv].flatMap((p, pi) => p.s.map((s, si) => `b|${lv}|${pi}|${si}`))]; }
function vocabItem(rng, w){ return 'v|' + w.w + '|' + pick(rng, vOtherTypes(w, '')); }
function mixedItem(lv, rng){
  const r = rng();
  if (r < 0.35) return vocabItem(rng, pick(rng, VBY(lv)));
  if (r < 0.6) return pick(rng, gramPool(lv));
  if (r < 0.68) return pick(rng, p2Items(lv));
  if (r < 0.75) return pick(rng, p1Items(lv));
  if (r < 0.85) return pick(rng, talkIdx(lv).flatMap(talkItems));
  if (r < 0.92) return pick(rng, p6Idx(lv).flatMap(p6Items));
  return pick(rng, p7Idx(lv).flatMap(p7Items));
}
function mockItems(lv){
  const rng = mulberry32(lv * 7919 + 13), items = [];
  VBY(lv).forEach(w => { const ts = shuffle(rng, vOtherTypes(w, '')); for (let i = 0; i < 3; i++) items.push('v|' + w.w + '|' + ts[i % ts.length]); });
  GRAMMAR[lv].forEach(r => { for (let i = 0; i < 3; i++) items.push('g|' + r.id); });
  BANK[lv].forEach((p, pi) => p.s.forEach((s, si) => items.push(`b|${lv}|${pi}|${si}`)));
  orderItems(lv).forEach(o => items.push(o));
  items.push(...p1Items(lv), ...p2Items(lv), ...talkIdx(lv).flatMap(talkItems), ...p6Idx(lv).flatMap(p6Items), ...p7Idx(lv).flatMap(p7Items));
  return shuffle(rng, items);
}
const MOCK_CACHE = {};

// ---------- 預估分數 ----------
function recordAcc(lv, sec, ok){
  const k = lv + sec, a = S.acc[k] = S.acc[k] || [0, 0];
  a[0] += ok ? 1 : 0; a[1]++;
  if (a[1] > 150) { a[0] /= 2; a[1] /= 2; }
}
const W_LV = {1:120, 2:120, 3:120, 4:130};
function scoreFrom(get){ // get(lv) → 正確率或 null
  let s = 5;
  for (const lv of LEVELS) { const a = get(lv); if (a == null) return null; s += W_LV[lv] * Math.max(0, (a - 0.28) / 0.72); }
  return Math.min(495, Math.round(s / 5) * 5);
}
function practiceEstimate(){
  const f = sec => scoreFrom(lv => { const a = S.acc[lv + sec]; return a && a[1] >= 8 ? a[0] / a[1] : null; });
  const L = f('L'), R = f('R');
  return L != null && R != null ? {L, R} : null;
}

// ---------- 語音 ----------
let VOICES = {};
function initVoice(){
  const pickV = () => {
    let vs = []; try { vs = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang)); } catch(e) {}
    const us = vs.filter(v => /en[-_]US/i.test(v.lang)), pool = us.length ? us : vs;
    const fem = /female|samantha|zira|jenny|aria|ava|allison|susan|karen|moira|tessa|victoria|serena|emma|libby|sonia/i, mal = /male|david|mark|guy|alex|daniel|fred|tom|aaron|ryan|christopher|eric|george/i;
    VOICES = {W:pool.find(v => fem.test(v.name)) || pool[0] || null, M:pool.find(v => mal.test(v.name) && !/female/i.test(v.name)) || pool[1] || pool[0] || null};
    VOICES.N = VOICES.W; VOICES.M2 = pool.find(v => v !== VOICES.M && mal.test(v.name) && !/female/i.test(v.name)) || VOICES.M;
  };
  try { pickV(); speechSynthesis.onvoiceschanged = pickV; } catch(e) {}
}
function utter(text, spk){
  const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = S.rate || 0.9;
  const v = VOICES[spk || 'W']; if (v) u.voice = v;
  if (VOICES.M === VOICES.W) u.pitch = spk === 'M' ? 0.8 : spk === 'M2' ? 0.65 : 1.15;
  return u;
}
function say(text, spk){ try { speechSynthesis.cancel(); speechSynthesis.speak(utter(text, spk)); } catch(e) { toast('這個瀏覽器不支援語音播放'); } }
function saySeq(seq){ try { speechSynthesis.cancel(); seq.forEach(([t, s]) => speechSynthesis.speak(utter(t, s))); } catch(e) { toast('這個瀏覽器不支援語音播放'); } }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-say]'); if (b) { e.stopPropagation(); say(b.dataset.say); return; }
  const q = e.target.closest('[data-seq]'); if (q && Q && Q.cur && Q.cur.seqSay) { e.stopPropagation(); saySeq(Q.cur.seqSay); }
});

// ---------- 通用測驗引擎 ----------
let Q = null;
function runQuiz(opt){
  if (Q && Q.tick) clearInterval(Q.tick);
  Q = {...opt, queue:opt.items.map(it => typeof it === 'string' ? {it} : {...it}), i:0, ok:0, n:0, wrong:[], seed:opt.seed ?? (Date.now() & 0xffffff), t0:Date.now()};
  if (Q.timed) Q.tick = setInterval(() => { const left = Math.max(0, Math.ceil((Q.timed.end - Date.now()) / 1000)), el = $('#tm'); if (el) el.textContent = left + ' 秒'; if (!left) { clearInterval(Q.tick); if (!Q.ended) quizEnd(); } }, 250);
  nextQ();
}
function nextQ(){
  if (Q.timed && Date.now() >= Q.timed.end) return quizEnd();
  if (Q.boss && (Q.boss.hp <= 0 || Q.boss.hearts <= 0)) return bossEnd();
  if (Q.i >= Q.queue.length) { if (Q.boss) Q.queue.push({it:mixedItem(S.lv, mulberry32(Q.seed + Q.i * 31))}); else return quizEnd(); }
  const e = Q.queue[Q.i], rng = mulberry32(Q.seed + Q.i * 7 + hashStr(e.it));
  Q.cur = buildItem(e.it, rng); Q.cur.entry = e; Q.cur.rng = rng;
  renderQ();
}
function quizHead(){

  let bossBar = '';

function renderOrder(){
  const c = Q.cur;
  if (!c.state) c.state = {pool:shuffle(c.rng, c.chunks.map((t, i) => ({t, i}))), ans:[], tries:0, hint:0};
  const st = c.state;
  view(quizHead() + `<section class="q"><div class="prompt" lang="zh-Hant">${c.prompt}</div><p class="sub">${c.sub}</p>
    <div class="ansline">${st.ans.map((x, k) => `<button class="chip on" data-k="${k}" ${k < st.hint ? 'disabled' : ''}>${esc(x.t)}</button>`).join('') || '<span class="ph">點下面的詞塊</span>'}</div>
    <div class="pool">${st.pool.map((x, k) => `<button class="chip" data-p="${k}">${esc(x.t)}</button>`).join('')}</div>
    <div class="row"><button class="ghost" id="clr">清除</button><button class="next" id="chk" ${st.pool.length ? 'disabled' : ''}>確認</button></div><div id="fb"></div></section>`);
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { st.ans.push(st.pool.splice(+b.dataset.p, 1)[0]); renderOrder(); });
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { st.pool.push(st.ans.splice(+b.dataset.k, 1)[0]); renderOrder(); });
  $('#clr').onclick = () => { st.pool.push(...st.ans.splice(st.hint)); renderOrder(); };
  $('#chk').onclick = () => {
    const ok = st.ans.map(x => x.t).join(' ') === c.chunks.join(' ');
    if (ok) { lockOrder(); return finish(st.tries === 0); }
    st.tries++;
    if (st.tries === 1) {
      const all = [...st.ans, ...st.pool], first = all.find(x => x.t === c.chunks[0]);
      st.ans = [first]; st.pool = all.filter(x => x !== first); st.hint = 1; renderOrder();
      $('#fb').innerHTML = `<div class="fbbox no">再試一次！提示：第一個詞塊是「${esc(c.chunks[0])}」</div>`;
    } else { lockOrder(); finish(false); }
  };
}

const LETTERS = 'abcdefghijklmnopqrstuvwxyz'.split('');
function renderSpell(){
  const c = Q.cur, e = c.entry, t = [...c.target];
  if (!c.state) {
    const n = Math.min(t.length - 1, (t.length >= 6 ? 3 : 2) + (e.retry || 0));
    const prev = e.prevBlanks || [];
    let idx = shuffle(c.rng, t.map((_, i) => i));
    idx = [...idx.filter(i => !prev.includes(i)), ...idx.filter(i => prev.includes(i))].slice(0, n).sort((a, b) => a - b);
    const need = [...new Set(idx.map(i => t[i]))], extra = shuffle(c.rng, LETTERS.filter(k => !need.includes(k))).slice(0, Math.max(3, 9 - need.length));
    c.state = {blanks:idx, fill:0, tiles:shuffle(c.rng, [...need, ...extra])};
  }
  const st = c.state;
  const word = t.map((ch, i) => { const b = st.blanks.indexOf(i); return b < 0 ? `<span class="sp">${ch}</span>` : `<span class="sp blank ${b < st.fill ? 'done' : ''} ${b === st.fill ? 'cur' : ''}">${b < st.fill ? ch : '＿'}</span>`; }).join('');
  view(quizHead() + `<section class="q"><div class="prompt" lang="zh-Hant">${c.prompt}<button class="say" data-say="${esc(c.say)}">🔊</button></div><p class="sub">${c.sub}${e.retry ? `　<b class="warn">（重考第 ${e.retry} 次，不計分）</b>` : ''}</p>
    <div class="spell">${word}</div><div class="tiles">${st.tiles.map((k, i) => `<button class="tile" data-t="${i}">${k}</button>`).join('')}</div><div id="fb"></div></section>`);
  document.querySelectorAll('.tile').forEach(b => b.onclick = () => {
    const want = t[st.blanks[st.fill]];
    if (st.tiles[+b.dataset.t] === want) {
      st.fill++;
      renderSpell();
      if (st.fill >= st.blanks.length) { document.querySelectorAll('.tile').forEach(x => x.disabled = true); finish(true); }
    } else {
      document.querySelectorAll('.tile').forEach(x => x.disabled = true); b.classList.add('bad');
      if ((e.retry || 0) < 3) Q.queue.splice(Math.min(Q.i + 4, Q.queue.length), 0, {it:e.it, retry:(e.retry || 0) + 1, prevBlanks:st.blanks, noScore:true});
      finish(false);
    }
  });
}

  for (const lv of LEVELS) {
    L.push(pick(rng, p1Items(lv)), pick(rng, p2Items(lv)), ...shuffle(rng, talkIdx(lv).flatMap(talkItems)).slice(0, 2), 'v|' + pick(rng, VBY(lv)).w + '|listen');
    R.push(...shuffle(rng, gramPool(lv)).slice(0, 2).map(g => g), 'v|' + pick(rng, VBY(lv)).w + '|e2c', pick(rng, p6Idx(lv).flatMap(p6Items)), pick(rng, p7Idx(lv).flatMap(p7Items)));
  }
  return [...shuffle(rng, L), ...shuffle(rng, R)];
}
function diagStart(){
  view(header('實力診斷') + `<section class="panel"><p>共 40 題：前 20 題聽力（Part 2・3・4＋單字聽力）、後 20 題閱讀（Part 5・6・7＋字彙），四個階段難度各佔四分之一。</p>
   <p>診斷時答對不會自動跳題，請像正式考試一樣專心作答。結果是<b>粗估</b>，用來看進步趨勢，實際成績以官方測驗為準。</p><button class="next" id="dg">開始診斷 ›</button></section>`);
  $('#dg').onclick = () => { const seed = Date.now() & 0xffffff; runQuiz({title:'實力診斷', items:diagItems(mulberry32(seed)), seed, noSupp:true, diag:{L:[], R:[]}}); };
}
function diagEnd(){
  const d = Q.diag, sec = s => scoreFrom(lv => { const a = d[s].filter(x => x[0] === lv); return a.length ? a.filter(x => x[1]).length / a.length : 0; });
  const L = sec('L'), R = sec('R'), mins = Math.round((Date.now() - Q.t0) / 60000);
  S.diag.push({date:today(), L, R}); if (S.diag.length > 30) S.diag.shift(); save();
  const hist = S.diag.slice(-8).map(x => `<div class="task"><span>${new Date(x.date).toLocaleDateString('zh-TW')}</span><span class="num">聽 ${x.L}・讀 ${x.R}</span><b>${x.L + x.R}</b></div>`).join('');
  const C = calibrated({L, R}), total = C.L + C.R, gap = Math.max(0, 800 - total);
  view(header('診斷結果') + `<section class="panel result"><div class="score">${total}<small> 分（${C.cal ? '已依官方試題校準' : '粗估'}）</small></div><p>聽力 ${C.L}・閱讀 ${C.R}　｜　用時 ${mins} 分鐘</p>
   <p>${gap ? `距離 800 分還差約 <b>${gap}</b> 分。${L < R ? '聽力比較弱：每天多做 Part 2 與 Part 3・4，並跟讀原文。' : '閱讀比較弱：加強 Part 5 文法與高頻字，Part 7 練習限時。'}` : '🎉 已達 800 分水準，持續用全真試題維持手感！'}</p>
   <button class="next" onclick="home()">回首頁</button>${C.cal ? '' : '<button class="ghost" onclick="calibMenu()">📝 做過官方全真試題？輸入成績來校準</button>'}</section><section class="panel"><h2>診斷紀錄（未校準原始值）</h2>${hist}</section>`);
}

// ---------- 半年計畫 ----------
function planView(){
  const wk = curWeek(), d = new Date(S.start), iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  view(header('半年衝刺計畫') + `<section class="panel"><p><b>從國中程度到多益 800，半年是很緊湊的目標。</b>建議每天投入 2.5～3 小時：App 約 60～90 分鐘（今日課表：到期複習 → 新字 → 文法聽讀），其餘時間做官方全真試題、跟讀聽力原文。週末各做一次實力診斷或模擬考。</p>
   <p>單字依字頻由常用到少用排序，第 24 週前學完全部 ${VOCAB.length} 字；每天新字量會依剩餘字數與複習量自動調整（目前每天約 ${paceBase().base} 個）。</p>
   <label class="row2">計畫開始日 <input type="date" id="sd" value="${iso}"></label></section>
   <section class="panel">${PLAN.map((p, i) => `<div class="wk ${i + 1 === wk ? 'cur' : ''} ${i + 1 < wk ? 'past' : ''}"><div class="wn">W${i + 1}</div><div><b>${esc(p.t)}</b> <span class="num">${p.lv ? LV_NAME[p.lv] : '總複習'}</span><div class="pf">${esc(p.f)}</div><div class="num">本週結束時累計目標：約 ${planTarget(i + 1)} 字</div></div></div>`).join('')}</section>`);
  $('#sd').onchange = e => { const v = e.target.value.split('-'); if (v.length === 3) { S.start = new Date(+v[0], +v[1] - 1, +v[2]).getTime(); const P = PLAN[curWeek() - 1]; if (P.lv) S.lv = P.lv; save(); planView(); } };
}

// ---------- 打怪模式 ----------
const MONSTERS = {
 1:[['📎','迴紋針小怪'],['🖨️','卡紙印表機'],['☕','咖啡因精'],['📧','垃圾郵件蟲'],['⏰','鬧鐘妖'],['👔','魔王・難搞主管']],
 2:[['📦','迷路包裹'],['🧾','發票小鬼'],['📞','奧客來電'],['✈️','延誤班機'],['📉','業績下滑怪'],['🏢','魔王・總部稽核']],
 3:[['📊','報表迷宮'],['🔒','密碼鎖精'],['🚧','施工路障'],['🧮','預算黑洞'],['🗂️','文件山'],['🦈','魔王・談判鯊魚']],
 4:[['⚖️','合約條款怪'],['🌪️','市場風暴'],['🕸️','供應鏈蜘蛛'],['🎯','KPI 刺客'],['🧊','冷凍併購案'],['🐉','大魔王・八百分巨龍']],
};
const HP = [6, 7, 8, 9, 10, 14];
function bossMenu(){
  const lv = S.lv, beat = S.boss[lv];
  view(header('打怪模式') + `<section class="panel"><p>答對攻擊、<b>連對 3 題暴擊 ×2</b>，答錯掉一顆心（共 3 顆）。打倒才會解鎖下一隻！題目混合單字、文法、聽力與閱讀。</p></section>
   <div class="monsters">${MONSTERS[lv].map((m, i) => `<button class="mcard ${i < beat ? 'beat' : ''} ${i > beat ? 'lock' : ''}" ${i > beat ? 'disabled' : ''} onclick="bossGo(${i})"><span>${i > beat ? '🔒' : m[0]}</span><b>${m[1]}</b><small>HP ${HP[i]}${i < beat ? '・已打倒' : ''}</small></button>`).join('')}</div>`);
}
function bossGo(i){
  const lv = S.lv, seed = Date.now() & 0xffffff, rng = mulberry32(seed);
  runQuiz({title:'打怪：' + MONSTERS[lv][i][1], items:Array.from({length:10}, () => mixedItem(lv, rng)), seed, noSupp:true, boss:{idx:i, m:MONSTERS[lv][i], hp:HP[i], max:HP[i], hearts:3, combo:0}});
}
function bossHit(ok){
  const b = Q.boss;
  if (ok) { b.combo++; const dmg = b.combo >= 3 ? 2 : 1; b.hp -= dmg; b.hit = true; if (dmg === 2) toast('💥 暴擊！×2'); }
  else { b.combo = 0; b.hearts--; }
  const m = document.querySelector('.mon'); if (m && ok) m.classList.add('hit');
  const hp = document.querySelector('.hp i'); if (hp) hp.style.width = Math.max(0, b.hp) / b.max * 100 + '%';
}
function bossEnd(){
  const b = Q.boss, lv = S.lv, win = b.hp <= 0;
  if (win && S.boss[lv] === b.idx) { S.boss[lv] = Math.min(6, b.idx + 1); save(); }
  view(header('打怪結果') + `<section class="panel result"><div class="score">${win ? '🏆' : '💫'}</div><h2>${win ? '打倒了「' + b.m[1] + '」！' : '被「' + b.m[1] + '」打敗了…'}</h2>
   <p>${win ? (b.idx < 5 ? '下一隻怪獸已解鎖！' : '你打倒了' + LV_NAME[lv] + '的魔王！') : '答錯的題目已收進錯題本，複習後再來挑戰吧。'}</p>
   <button class="next" onclick="bossMenu()">回怪獸列表 ›</button><button class="ghost" onclick="home()">回首頁</button></section>`);
}

// ---------- 設定：語速、字體 ----------
const RATES = [[0.75,'慢'],[0.9,'標準（練習）'],[1,'正常（接近考試）']];
const rateChips = () => `<div class="chips" id="rt">${RATES.map(r => `<button class="chip ${S.rate === r[0] ? 'on' : ''}" data-v="${r[0]}">🔊 ${r[1]}</button>`).join('')}</div>`;
const bindRate = () => chipPick('#rt', v => { S.rate = +v; save(); say('This is the speaking speed.'); });
const FZ = [['auto','自動','手機標準，平板自動放大'],['1','標準',''],['1.15','大',''],['1.3','特大','']];
function fontScale(){ const v = S.fz || 'auto'; if (v !== 'auto') return +v; try { return Math.min(screen.width, screen.height) >= 600 ? 1.2 : 1; } catch(e) { return 1; } }
function applyFont(){ try { document.documentElement.style.setProperty('--z', fontScale()); } catch(e) {} }
function settings(){
  const d = document.createElement('div'); d.className = 'mask';
  d.innerHTML = `<div class="guide"><h2>⚙️ 設定</h2><h3>英文語速</h3>${rateChips()}<h3>字體大小</h3><div class="fzopts">${FZ.map(f => `<button class="li ${String(S.fz || 'auto') === f[0] ? 'on' : ''}" data-fz="${f[0]}"><b style="font-size:${f[0] === 'auto' ? 16 : 16 * +f[0]}px">${f[1]}　Aa 字</b>${f[2] ? `<small>${f[2]}</small>` : ''}</button>`).join('')}</div><button class="next" id="fzok">完成</button></div>`;
  document.body.appendChild(d); bindRate();
  d.querySelectorAll('[data-fz]').forEach(b => b.onclick = () => { S.fz = b.dataset.fz; save(); applyFont(); d.querySelectorAll('[data-fz]').forEach(x => x.classList.toggle('on', x === b)); });
  d.querySelector('#fzok').onclick = () => { d.remove(); home(); };
  d.onclick = e => { if (e.target === d) { d.remove(); home(); } };
}

// ---------- 安裝引導 ----------
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; renderInstall(); });
const UA = navigator.userAgent;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
const isIOS = () => /iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const isIPad = () => /iPad/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const inApp = () => /Line\/|FBAN|FBAV|Instagram/i.test(UA);
function renderInstall(){
  const box = $('#install'); if (!box || isStandalone()) return;
  if (inApp()) { box.innerHTML = `<section class="panel inst"><b>📲 想裝到手機？</b><p>你現在在 LINE／Facebook 的內建瀏覽器，請點右上角選單，選「用預設瀏覽器開啟」（iPhone 用 Safari、Android 用 Chrome）再安裝。</p></section>`; return; }
  if (deferredPrompt) { box.innerHTML = `<section class="panel inst"><b>📲 裝到手機，沒網路也能練習</b><button class="next" id="ins">裝到手機</button></section>`; $('#ins').onclick = async () => { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; box.innerHTML = ''; }; return; }
  if (isIOS()) { box.innerHTML = `<section class="panel inst"><b>📲 加到 iPhone 主畫面</b><button class="ghost" onclick="iosGuide(true)">看安裝步驟</button></section>`; let shown = false; try { shown = !!sessionStorage.getItem('iosShown'); sessionStorage.setItem('iosShown', '1'); } catch(e) {} if (!S.noIOS && !shown) setTimeout(() => iosGuide(), 900); }
}
function iosGuide(force){
  const m = UA.match(/Version\/(\d+)/), v = m ? +m[1] : 0, ipad = isIPad(), new26 = v >= 26;
  const step1 = ipad ? '點右上角的「分享」按鈕 <span class="shr">⬆️</span>' : (new26 ? '點右下角的「⋯」，再點「分享」<span class="shr">⬆️</span>' : '點下方中間的「分享」按鈕 <span class="shr">⬆️</span>');
  const arrow = ipad ? 'tr' : (new26 ? 'br' : 'bc');
  const d = document.createElement('div'); d.className = 'mask';
  d.innerHTML = `<div class="guide"><h2>3 步驟裝到主畫面</h2><ol><li>${step1}</li><li>往下滑，點「加入主畫面」➕</li><li>右上角點「加入」，完成！</li></ol><p class="sub">蘋果規定 iPhone 不能一鍵安裝，要用 Safari 手動加入。</p><div class="row"><button class="ghost" id="nomore">不要再提醒</button><button class="next" id="okg">知道了</button></div></div><div class="finger ${arrow}">👇</div>`;
  document.body.appendChild(d);
  d.querySelector('#okg').onclick = () => d.remove();
  d.querySelector('#nomore').onclick = () => { S.noIOS = true; save(); d.remove(); };
}

// ---------- 啟動 ----------
load(); applyFont(); initVoice();
{ const wk = curWeek(), P = PLAN[wk - 1]; if (S.lastWk !== wk) { if (P.lv) S.lv = P.lv; S.lastWk = wk; save(); } }
home();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const hadSW = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !reloaded && !Q) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
